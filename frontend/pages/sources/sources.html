<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление Источниками</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <h1>Управление Источниками Знаний</h1>
    </header>
    <nav>
        <a href="../topics/topics.html">Управление Темами</a> | 
        <a href="../tags/tags.html">Управление Тегами</a> |
        <a href="../sources/sources.html"><strong>Управление Источниками</strong></a>
    </nav>
    <main>
        <h2>Существующие источники</h2>
        <table id="sources-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>URL</th>
                    <th>Тема</th>
                    <th>Теги</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <!-- Данные будут вставлены сюда с помощью JavaScript -->
            </tbody>
        </table>

        <hr>

        <h2>Добавить новый источник</h2>
        <form id="add-source-form">
            <input type="hidden" id="source-id">

            <label for="source-title">Название:</label>
            <input type="text" id="source-title" required>
            
            <label for="source-url">URL:</label>
            <input type="url" id="source-url">

            <label for="source-topic">Тема:</label>
            <select id="source-topic" required>
                <!-- Опции для тем будут загружены сюда -->
                <option value="">Загрузка...</option>
            </select>

            <label>Теги:</label>
            <div id="source-tags-container">
                <!-- Чекбоксы для тегов будут загружены сюда -->
                Загрузка...
            </div>

            <label for="source-content">Контент:</label>
            <textarea id="source-content" rows="10" required></textarea>
            
            <button type="submit">Добавить</button>
        </form>
    </main>

    <script src="sources.js"></script>
</body>
</html>
