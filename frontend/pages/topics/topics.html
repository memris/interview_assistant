
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление Темами</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <h1>Управление Темами</h1>
    </header>
    <nav>
    <a href="../topics/topics.html"><strong>Управление Темами</strong></a> | 
    <a href="../tags/tags.html">Управление Тегами</a>
    <a href="../sources/sources.html">Управление Источниками</a>
    </nav>

    <main>
        <h2>Существующие темы</h2>
        <table id="topics-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>

        <hr>

        <h2>Добавить новую тему</h2>
        <form id="add-topic-form">
            <label for="topic-name">Название темы:</label>
            <input type="text" id="topic-name" required>
            
            <label for="topic-description">Описание:</label>
            <textarea id="topic-description"></textarea>
            
            <button type="submit">Добавить</button>
        </form>
    </main>


    <script src="topics.js"></script>
</body>
</html>
